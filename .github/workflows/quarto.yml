name: quarto
on: push
  
jobs:
  main:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v7 #actions nazwa konta, checkout nazwa repozytoirum
      - uses: quarto-dev/quarto-actions/setup@v2
        with: 
          tinytex: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jupyter pyyaml numpy matplotlib PyMPDATA
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: quarto render projekt.ipynb --to pdf --execute
      - uses: actions/upload-artifact@v4
        with:
          name: raport_projekt
          path: projekt.pdf
