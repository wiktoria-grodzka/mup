name: quarto
on: push
jobs:
  main:
    runs-on: ubuntu-latest
    steps: 
      - actions/checkout@v7 #actions nazwa konta, checkout nazwa repozytoirum
      - quarto-dev/quarto-actions/setup@v2
      - with:
        tinytex:true
      - actions/setup-python@v5
      - with:
        python-version: "3.12"
      - run: |
        python -m pip install numpy matplotlib PyMPDATA
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: quarto render z1.ipynb --to pdf --execute
